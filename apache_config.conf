# VM Manager Apache configuration

<VirtualHost *:80>
    ServerName vmmanager.example.com
    ServerAdmin webmaster@example.com
    
    # Set document root
    DocumentRoot /var/www/vmmanager
    
    # Enable WSGI
    WSGIDaemonProcess vmmanager python-home=/var/www/vmmanager/venv python-path=/var/www/vmmanager
    WSGIProcessGroup vmmanager
    WSGIScriptAlias / /var/www/vmmanager/wsgi.py
    
    # Configure directory permissions
    <Directory /var/www/vmmanager>
        Require all granted
        WSGIScriptReloading On
    </Directory>
    
    # Set up static files
    Alias /static /var/www/vmmanager/static
    <Directory /var/www/vmmanager/static>
        Require all granted
    </Directory>
    
    # Error and access logs
    ErrorLog ${APACHE_LOG_DIR}/vmmanager-error.log
    CustomLog ${APACHE_LOG_DIR}/vmmanager-access.log combined
</VirtualHost>
